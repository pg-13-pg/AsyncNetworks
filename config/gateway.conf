# UCP reverse-proxy correctness baseline

[gateway]
listen_ip = 127.0.0.1
listen_port = 8080
workers = 4
header_limit = 16384
body_limit = 1048576
graceful_shutdown_ms = 5000

[event_loop]
ring_entries = 4096
sqpoll = false
sqpoll_idle_ms = 50
registered_buffers_count = 0
registered_buffer_size = 4096
pending_queue_capacity = 65536
pending_submission_capacity = 4096

[route.api]
prefix = /api/
upstreams = 127.0.0.1:9001,127.0.0.1:9002
connect_timeout_ms = 500
response_timeout_ms = 3000
max_connections_per_worker = 128
max_idle_per_worker = 32
idle_timeout_ms = 30000
