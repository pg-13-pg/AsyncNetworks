# Single-worker mock upstream instance on port 9002

[server]
host = 127.0.0.1
port = 9002
workers = 1

[event_loop]
ring_entries = 32768
sqpoll = false
sqpoll_idle_ms = 50
registered_buffers_count = 16384
registered_buffer_size = 4096
pending_queue_capacity = 65536
pending_submission_capacity = 4096
pending_queue_high_water_mark = 58982
pending_queue_low_water_mark = 26214
enable_queue_full_stats = true
